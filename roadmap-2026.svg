    <text x="128" y="72" font-size="13" font-weight="600" fill="#FFFFFF" letter-spacing="2">EDITH</text>
    <text x="128" y="90" font-size="11" fill="#7A8AA8" letter-spacing="1">PLATFORM</text>

    <text x="90" y="170" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">Produkt-Roadmap 2026</text>
