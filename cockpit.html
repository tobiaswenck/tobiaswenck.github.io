<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Execution Cockpit</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='3' fill='none' stroke='%23e3c06b' stroke-width='1.5'/%3E%3Cpath d='M12 3v2M12 19v2M3 12h2M19 12h2' stroke='%23e3c06b' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="cockpit/css/base.css">
    <link rel="stylesheet" href="cockpit/css/views.css">
  </head>

  <body>
    <a class="skip-link" href="#view">Skip to content</a>

    <header class="topbar" role="banner">
      <div class="topbar-left">
        <a href="dashboard-alternative.html" class="icon-btn" title="Back to dashboard" aria-label="Back to dashboard">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
        <span class="brand">Cockpit</span>
      </div>

      <nav class="view-nav" aria-label="Views">
        <button type="button" data-view="now" aria-current="page">Now</button>
        <button type="button" data-view="week">Week</button>
        <button type="button" data-view="waiting">Waiting <span id="waiting-count" class="nav-count" hidden></span></button>
        <button type="button" data-view="reset">Reset <span id="reset-count" class="nav-count" hidden></span></button>
      </nav>

      <div class="topbar-right">
        <button type="button" class="ghost-btn" id="capture-btn" title="Capture a thought (Ctrl+K)">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          Capture
        </button>
        <div class="menu-wrap">
          <button type="button" class="icon-btn" id="menu-btn" aria-haspopup="true" aria-expanded="false" aria-label="More options">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/>
            </svg>
          </button>
          <div class="menu" id="menu" role="menu" hidden>
            <button type="button" role="menuitem" data-menu="inbox">Review inbox <span id="inbox-count" class="nav-count" hidden></span></button>
            <button type="button" role="menuitem" data-menu="export">Export data</button>
            <button type="button" role="menuitem" data-menu="import">Import data</button>
            <button type="button" role="menuitem" data-menu="settings">Settings</button>
            <button type="button" role="menuitem" data-menu="remove-demo" hidden>Remove example data</button>
          </div>
        </div>
      </div>
    </header>

    <div id="banners" aria-live="off"></div>

    <main id="view" tabindex="-1"></main>

    <div id="overlays"></div>

    <div id="live-region" class="sr-only" role="status" aria-live="polite"></div>

    <input type="file" id="import-file" accept="application/json,.json" class="sr-only" tabindex="-1" aria-hidden="true">

    <script type="module" src="cockpit/js/app.js"></script>
  </body>
</html>
